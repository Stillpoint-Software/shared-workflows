name: Format

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to use for the workflow"
        type: string
        required: true
      dotnet_version:
        description: >-
          SDK version(s) to install for dotnet format, passed straight to
          actions/setup-dotnet. Defaults to the version this repo has always
          used. Example for a net11.0 project: '11.0.x'
        required: false
        type: string
        default: "10.0.x"
jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Format Code
        run: dotnet format

      - name: Commit & Push Updated Styles
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git diff --quiet || (git commit -am "chore: format code with dotnet format" && git push)
